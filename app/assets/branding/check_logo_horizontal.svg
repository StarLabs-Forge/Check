<svg width="720" height="180" viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hPurple" x1="10" y1="10" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B47CFF"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="hCyan" x1="150" y1="10" x2="100" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DF3FF"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="hCheck" x1="35" y1="105" x2="130" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="hGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="180" fill="#050507"/>

  <!-- Ícono -->
  <g transform="translate(20,20)" filter="url(#hGlow)">
    <path d="M22,60 L22,33 Q22,22 33,22 L60,22" fill="none" stroke="url(#hPurple)"
          stroke-width="10.5" stroke-linecap="round"/>
    <path d="M90,22 L117,22 Q128,22 128,33 L128,60" fill="none" stroke="url(#hCyan)"
          stroke-width="10.5" stroke-linecap="round"/>
    <path d="M22,90 L22,117 Q22,128 33,128 L60,128" fill="none" stroke="url(#hPurple)"
          stroke-width="10.5" stroke-linecap="round"/>
    <path d="M128,90 L128,117 Q128,128 117,128 L90,128" fill="none" stroke="url(#hCyan)"
          stroke-width="10.5" stroke-linecap="round"/>

    <g fill="#F5F5FA">
      <rect x="42" y="42" width="24" height="24" rx="2"/>
      <rect x="48" y="48" width="12" height="12" rx="1.5" fill="#050507"/>
      <rect x="52.5" y="52.5" width="3" height="3" fill="#F5F5FA"/>
      <rect x="75" y="42" width="10.5" height="10.5" rx="1.5"/>
      <rect x="91.5" y="42" width="6" height="6" rx="1.2"/>
      <rect x="42" y="75" width="10.5" height="10.5" rx="1.5"/>
      <rect x="42" y="91.5" width="6" height="16.5" rx="1.5"/>
      <rect x="57" y="91.5" width="6" height="6" rx="1.2"/>
      <rect x="75" y="75" width="6" height="6" rx="1.2"/>
    </g>

    <path d="M37,87 L66,109.5 L117,48" fill="none" stroke="url(#hCheck)"
          stroke-width="13.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Divisor -->
  <line x1="185" y1="30" x2="185" y2="140" stroke="#3A3A55" stroke-width="1.5"/>

  <!-- Wordmark: Space Grotesk (geométrica). Si se abre este .svg suelto en un
       navegador sin la fuente instalada, cae al fallback Arial/sans-serif;
       para que se vea con Space Grotesk en la web hay que cargarla en la
       página que lo incluye (ver nota de integración). -->
  <text x="215" y="105" font-family="'Space Grotesk', Arial, Helvetica, sans-serif" font-weight="700"
        font-size="66" letter-spacing="0" fill="#F5F5FA">CHECK</text>

  <!-- Tagline con acentos -->
  <line x1="215" y1="132" x2="245" y2="132" stroke="url(#hPurple)" stroke-width="2.5" stroke-linecap="round"/>
  <text x="255" y="137" font-family="'Space Grotesk', Arial, Helvetica, sans-serif" font-weight="500"
        font-size="14" letter-spacing="2.2" fill="#C7C7D9">CONTROL TOTAL DE TUS EVENTOS</text>
  <line x1="655" y1="132" x2="685" y2="132" stroke="url(#hCyan)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
